name: Smoke

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check smoke assertions
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Verify and package core app
        run: mvn -B -ntp -pl qqq-all-app -am verify
      - name: Smoke packaged core over HTTP
        run: python3 scripts/run_core_smoke.py qqq-all-app/target/qqq-all-app.jar

  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package full app for Docker image
        run: >-
          mvn -B -ntp -pl qqq-all-app -am -DskipTests
          dependency:build-classpath -DincludeGroupIds=com.kingsrook.qqq,com.kingsrook.qbits
          -Dmdep.outputFile=target/smoke-classpath.txt package
      - name: Smoke full Compose over HTTP
        run: python3 scripts/run_full_smoke.py
      - name: Retain sanitized full smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-smoke-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/smoke-diagnostics/*.json
          if-no-files-found: warn
          retention-days: 14
