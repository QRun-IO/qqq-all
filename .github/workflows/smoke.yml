name: Smoke

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check smoke assertions
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Verify and package core app
        run: mvn -B -ntp -pl qqq-all-app -am verify
      - name: Smoke packaged core over HTTP
        run: python3 scripts/run_core_smoke.py qqq-all-app/target/qqq-all-app-4.1.0-SNAPSHOT.jar
