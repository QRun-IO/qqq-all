name: Publish develop image

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify application
        run: mvn -B -ntp verify
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish develop image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/QRun-IO/qqq-all \
            --tag ghcr.io/qrun-io/qqq-all:develop .
          docker push ghcr.io/qrun-io/qqq-all:develop
      - name: Require public package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          visibility="$(gh api /orgs/QRun-IO/packages/container/qqq-all --jq .visibility)"
          test "$visibility" = public || {
            echo 'Set the qqq-all container package visibility to public in GitHub package settings.' >&2
            exit 1
          }
