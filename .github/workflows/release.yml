name: Release 4.1.0
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed source version (GA or exact coordinated RC)
        required: true
        type: choice
        default: 4.1.0
        options:
        - 4.1.0
        - 4.1.0-RC.1
      release_sha:
        description: Full develop commit SHA already signed and tagged with the selected
          version
        required: true
        type: string
      smoke_run_id:
        description: Successful Smoke workflow run ID for that exact develop SHA
        required: false
        type: string
        default: ''
      smoke_evidence:
        description: Evidence provider; github preserves the original Smoke workflow
          validation
        type: choice
        default: circle
        options:
        - github
        - circle
        required: true
      circle_workflow_id:
        description: Exact successful Circle workflow UUID when circle evidence is
          selected
        type: string
        required: false
        default: ''
permissions:
  actions: read
  contents: write
  packages: write
  checks: read
jobs:
  release:
    uses: QRun-IO/qqq-orb/.github/workflows/qqq-all-release.yml@0f33ddadf88b9a1b940b8883782fe2000ee1d2bd
    with:
      version: ${{ inputs.version }}
      release_sha: ${{ inputs.release_sha }}
      smoke_run_id: ${{ inputs.smoke_run_id }}
      smoke_evidence: ${{ inputs.smoke_evidence }}
      circle_workflow_id: ${{ inputs.circle_workflow_id }}
    secrets:
      CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
